version: '3.8'

services:
  # PostgreSQL Database - Always runs
  postgres:
    image: postgres:16-alpine
    container_name: energy-control-postgres
    environment:
      POSTGRES_DB: energy_control
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: energy_pass
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - energy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_user -d energy_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Application - Optional (use --profile app to run)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: energy-control-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: energy_control
      DB_USERNAME: energy_user
      DB_PASSWORD: energy_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - energy-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    profiles:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # pgAdmin - Optional (use --profile admin to run)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: energy-control-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@energy-control.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - energy-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  energy-network:
    driver: bridge
