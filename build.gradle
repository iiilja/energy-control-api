plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.ilja.smarthome'
version = '1.0.0-SNAPSHOT'

java {
    // Compile and run tests on JDK 17 (same as the Docker images), whatever JDK runs Gradle.
    // Missing JDKs are downloaded automatically (foojay resolver in settings.gradle).
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Spring Boot 3.2 ships Testcontainers 1.19.3, which cannot talk to Docker Engine 29+
// (Docker Desktop 4.5x, current GitHub runners): it uses a Docker API version they no longer accept.
ext['testcontainers.version'] = '1.21.4'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OAuth2 Authorization Server
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'

    // Hibernate types for JSONB
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.0'

    // JSON processing
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // OpenAPI/Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct for DTO mapping
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Modbus TCP (Sungrow inverter)
    implementation 'com.ghgande:j2mod:3.2.1'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Repository/migration tests against a real PostgreSQL in Docker (skipped when Docker is not running)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

// Only the executable boot jar; the extra -plain.jar would also match COPY *.jar in the Dockerfiles
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    // Same default time zone as the Docker image. With hibernate.jdbc.time_zone=UTC, Hibernate shifts
    // LocalTime (TIME columns, e.g. the weekly template) by the JVM's offset, so on a Tallinn-time PC the
    // PostgreSQL tests would store 00:00 as 22:00.
    systemProperty 'user.timezone', 'UTC'
}
