spring:
  application:
    name: energy-control-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:energy_control}
    username: ${DB_USERNAME:energy_user}
    password: ${DB_PASSWORD:energy_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EnergyControlHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true

  # OAuth2 Authorization Server
  security:
    oauth2:
      authorizationserver:
        issuer: ${ISSUER_URI:http://localhost:8080}

  # Spring Boot DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true


# Sungrow SG15RT inverter (Modbus TCP)
sungrow:
  host: ${SUNGROW_HOST:192.168.8.110}
  port: ${SUNGROW_PORT:502}
  slave-id: ${SUNGROW_SLAVE_ID:1}
  timeout-ms: ${SUNGROW_TIMEOUT_MS:5000}
  rated-power-kw: ${SUNGROW_RATED_POWER_KW:15}

# Thermia heat pump (Modbus TCP)
thermia:
  host: ${THERMIA_HOST:192.168.8.126}
  port: ${THERMIA_PORT:502}
  slave-id: ${THERMIA_SLAVE_ID:1}
  timeout-ms: ${THERMIA_TIMEOUT_MS:5000}

# Collection scheduler configuration
collection:
  interval:
    ms: ${COLLECTION_INTERVAL_MS:60000}  # 1 minute default

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    com.ilja.smarthome.energycontrol: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/energy-control-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  shutdown: graceful

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none

