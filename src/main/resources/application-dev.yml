spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.ilja.smarthome.energycontrol: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

# Faster collection interval for development (30 seconds)
collection:
  interval:
    ms: 30000

# Development server configuration
server:
  error:
    include-stacktrace: on_param
