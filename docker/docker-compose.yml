version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: energy-control-postgres
    environment:
      POSTGRES_DB: energy_control
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: energy_pass
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - energy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_user -d energy_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: energy-control-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@energy-control.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - energy-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local

networks:
  energy-network:
    driver: bridge
